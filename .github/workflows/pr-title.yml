name: PR title

# PR мержатся squash-ом, и заголовок PR становится сообщением коммита в main.
# release-please строит версию и CHANGELOG из этих сообщений, поэтому заголовок
# обязан быть conventional commit: feat: …, fix(api): …, feat!: …

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Описание после «тип:» — любое, в том числе на русском, но не с
          # заглавной латинской буквы по привычке англоязычных гайдов.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Описание «{subject}» не должно начинаться с заглавной латинской буквы.
