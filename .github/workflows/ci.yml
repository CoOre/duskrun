name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release вызывает тот же набор проверок перед сборкой артефактов.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow у вызванного workflow — имя вызывающего, поэтому прогон из
  # Release не делит группу с обычным CI на main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go · тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go.mod и go.sum актуальны
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Покрытие в summary
        run: |
          {
            echo '### Покрытие Go'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Go · golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  vuln:
    name: Go · govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  web:
    name: Web · тесты и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm test -- --run
      - name: vite build
        run: npm run build
      - name: Сборка не пачкает дерево
        # Vite чистит internal/web/dist, а .gitkeep там нужен go:embed в чистом
        # клоне. Плагин в vite.config.ts возвращает его; здесь это проверяется.
        run: |
          test -f ../internal/web/dist/.gitkeep
          git status --porcelain
          test -z "$(git status --porcelain)"

  docker:
    name: Docker · сборка и smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: duskrun:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Клиенты БД на месте
        run: |
          out=$(docker run --rm duskrun:ci doctor)
          echo "$out"
          for tool in pg_dump mysqldump mongodump redis-cli; do
            if echo "$out" | grep -E "^\s+$tool\s+MISSING"; then
              echo "::error::$tool отсутствует в образе"; exit 1
            fi
          done
      - name: Сервер поднимается
        run: |
          docker run -d --name duskrun -p 8080:8080 \
            -e DUSKRUN_MASTER_KEY="$(openssl rand -base64 48)" \
            -e DUSKRUN_API_TOKEN="ci-$(openssl rand -hex 16)" \
            duskrun:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && exit 0
            sleep 1
          done
          docker logs duskrun
          exit 1

  goreleaser:
    name: Релиз · dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
